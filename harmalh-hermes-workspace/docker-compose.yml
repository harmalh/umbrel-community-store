version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: harmalh-hermes-workspace_workspace_1
      APP_PORT: 3000

  workspace:
    image: ghcr.io/harmalh/hermes-workspace-ui-umbrel:0.1.6@sha256:5227d34f0b80cc58f54ce0cdd8289b1f7068b9a5b9c8097da09559a3daa71d7a
    restart: on-failure
    init: true
    depends_on: [hermes-api]
    environment:
      NODE_ENV: "production"
      HERMES_API_URL: "http://hermes-api:8642"

  hermes-api:
    image: ghcr.io/harmalh/hermes-workspace-api-umbrel:0.1.6@sha256:b8b5cbebd5d29c59ab24af7642351d3bfe69f70213ce1bd6ce0ab0e7862810fd
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      HOME: /opt/hermes-home
    volumes:
      - ${APP_DATA_DIR}/hermes:/opt/hermes-home
