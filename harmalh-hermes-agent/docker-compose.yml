version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: harmalh-hermes-agent_web_1
      APP_PORT: 80

  web:
    image: nginx:1.25-alpine
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro

  # Multi-arch index digest from workflow run 23928504678 (main @ 2026-04-03).
  hermes:
    image: ghcr.io/harmalh/hermes-agent-umbrel:0.2.5@sha256:19096da242a600669f5f4a54d7e2d23fa710657d531b361065ba28b09c476acc
    restart: on-failure
    init: true
    stop_grace_period: 1m
    shm_size: "1g"
    command: ["gateway", "run"]
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
